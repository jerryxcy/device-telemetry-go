services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemetry"]
      interval: 2s
      timeout: 3s
      retries: 15

  device-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: device-service
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/telemetry?sslmode=disable
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://localhost:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
