services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemetry"]
      interval: 2s
      timeout: 3s
      retries: 15

  device-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: device-service
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/telemetry?sslmode=disable
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://localhost:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 10

  telemetry-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: telemetry-service
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/telemetry?sslmode=disable
      GRPC_ADDR: ":9091"
      # 對外只有 gRPC,但指標與探活走 HTTP,所以另外開一個管理面。
      METRICS_ADDR: ":8081"
      DEVICE_GRPC_ADDR: "device-service:9090"
    ports:
      - "9091:9091"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      device-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://localhost:8081/healthz"]
      interval: 3s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 學習用的保存期。預設是 15 天,這裡沒必要留那麼久。
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9092:9090"
    depends_on:
      - device-service
      - telemetry-service

  grafana:
    image: grafana/grafana:11.5.1
    environment:
      # 這是本機的學習環境,省掉登入。不要照抄到任何對外的地方。
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./deploy/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./deploy/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  promdata:
  grafanadata:
